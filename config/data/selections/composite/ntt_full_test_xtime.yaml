# Tier 1 (test) — Within-session temporal eval. Same sessions as train;
# use with split='test' to evaluate on the held-out test_domain.
# NOTE: Do NOT set ignore_splits for this tier (split-respecting).
# Membership = training sessions = each training brainset MINUS its
# test-OOD sessions (the exclude lists below are the union of the
# ntt_full_test_xsession + ntt_full_test_xsubject composites).
# xsource brainsets (c4/cowley/wingert) are entirely held out from
# training and have no xtime membership, so they are omitted here
# (mirrors ntt_full_val_xtime.yaml).
# Regenerate when the test-OOD composites change: the exclude lists are the
# per-brainset union of ntt_full_test_xsession.yaml + ntt_full_test_xsubject.yaml.
# NOTE: this is the tier-GROUPING definition only. Computing a leak-free
# test_domain baseline also requires a data config with ignore_splits=false
# at split=test, which is not yet wired.
_target_: ntt.core.data.components.config.SelectionConfig
