# https://mlflow.org
_target_: lightning.pytorch.loggers.mlflow.MLFlowLogger
experiment_name: ${paths.experiment_name}
run_name: ${paths.run_name}
# The server in MLFLOW_TRACKING_URI; without one, a local SQLite store under logs/.
tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,"sqlite:///${paths.log_dir}/mlflow.db"}
# tags: ${tags}
save_dir: "${paths.output_dir}"
prefix: ""
artifact_location: null
log_model: True
