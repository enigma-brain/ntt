# Composite loss: Poisson NLL + MSE for rate-based tokenizers
#
# Poisson NLL is the primary loss for spike rate prediction.
# MSE adds a smooth gradient signal for rate magnitude matching.

_target_: ntt.contrib.loss.MultiLossSpec
KIND: multi

reduction: mean
components:
  - loss:
      KIND: poisson_nll
      log_input: false
      full: false
      eps: 1.0e-8
    weight: 1.0
    name: poisson_nll
  - loss:
      KIND: mse
    weight: 0.1
    name: mse
