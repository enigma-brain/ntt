# @package _global_

defaults:
  - override /job: train
  - override /tokenizer@job.tokenizer_config: contrib/fsqffn
  - override /loss@job.loss_config: contrib/poisson_nll
  - override /data@job.data_config: ntt_full

job:
  loss_config:
    full: false
  data_config:
    unit_dropout_exclude_zero: true
    unit_dropout_sampling_strategy: linear_weighted
    unit_dropout_sampling_use_global_stats: true
    dataloader:
      batch_size: 256
  compile_config:
    enabled: false
  trainer:
    val_check_interval: 750
    limit_val_batches: 100
