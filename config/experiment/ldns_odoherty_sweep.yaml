# @package _global_

defaults:
  - override /job: train
  - override /logger@job.trainer.logger.mlflow: wandb
  - override /tokenizer@job.tokenizer_config: contrib/ldns
  - override /loss@job.loss_config: contrib/poisson_nll
  - override /data@job.data_config: odoherty_only
  - override /optimizer@job.optimizer_gen: adamw
  - override /scheduler@job.scheduler_config: linear_warmup_cosine_annealing

# Odoherty-equivalent schedule under this config:
# - 1914 optimizer steps per epoch
# - 100 epochs total
train_max_steps: 191400
behavioral_eval_every_n_steps: 7656

job:
  trainer:
    max_epochs: null
    max_steps: ${train_max_steps}
    val_check_interval: ${behavioral_eval_every_n_steps}
    check_val_every_n_epoch: null
    limit_val_batches: 1000
    num_sanity_val_steps: 0
    callbacks:
      early_stopping: null
      model_checkpoint:
        save_last: true
        every_n_train_steps: 38280
        every_n_epochs: null
      tokenizer_eval:
        eval_config: {}
        lightning_config:
          eval_on_epoch_end: false
          full_eval_every_n_epochs: 1
          full_eval_at_training_end: true
          poisson_rate_estimation_bin_ms: 33.0
      behavioral_dataset_eval:
        _target_: ntt.evaluation.lightning.BehavioralDatasetEvalCallback
        eval_config:
          _target_: ntt.evaluation.config.schema.EvaluationConfig
          allow_lossy_conversion: true
          conversion_bin_size_ms: 1.0
          max_windows: 100
          max_bytes: null
          compute_baseline: false
          metrics:
            behavioral_regression_cursor_pos:
              metric_class: behavioral_regression
              target_field: cursor_pos
              grouping_field: window_group_id_token_res
              train_include_phases: null
              train_drop_invalid: false
              eval_include_phases: null
              eval_drop_invalid: false
            behavioral_regression_cursor_vel:
              metric_class: behavioral_regression
              target_field: cursor_vel
              grouping_field: window_group_id_token_res
              train_include_phases: null
              train_drop_invalid: false
              eval_include_phases: null
              eval_drop_invalid: false
            behavioral_temporal_decoder_cursor_pos:
              metric_class: behavioral_temporal_decoder
              target_field: cursor_pos
              grouping_field: window_group_id_token_res
              include_phases: null
              drop_invalid: false
            behavioral_temporal_decoder_cursor_vel:
              metric_class: behavioral_temporal_decoder
              target_field: cursor_vel
              grouping_field: window_group_id_token_res
              include_phases: null
              drop_invalid: false
        selections:
          - _target_: ntt.core.data.components.config.SelectionConfig
            selection:
              - brainset: odoherty_sabes_nonhuman_2017
                sessions:
                  - loco_20170216_02
                  - loco_20170301_05
            config:
              ignore_splits: true
        compute_poisson_baseline: true
        log_prefix: behavioral_dataset_eval
        max_batches: 7
        max_sessions: null
        aggregation_strategy: mean
        eval_on_epoch_end: true
        every_n_epochs: 1
        run_on_fit_end: true
  compile_config:
    enabled: false
  data_config:
    pad_neurons_to_fixed: ${job.tokenizer_config.n_neurons}
    dataloader:
      batch_size: 32
  optimizer_gen:
    lr: 0.001
  scheduler_config:
    warmup_steps: 5000
  tokenizer_config:
    n_neurons: 128
    window_length_seconds: 0.495
    bin_size_ms: 33
