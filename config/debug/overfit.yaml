# @package _global_

# Overfit on a small number of batches for debugging.
# Usage: uv run ntt debug=overfit ...
#
# Uses Trainer.overfit_batches to repeatedly train on the same batches.
# Train shuffling is disabled so batches are consistent across epochs.
job:
  viz_every_n_steps: 50
  disable_val_viz: true
  trainer:
    # overfit_batches: 10
    limit_train_batches: 1
    limit_val_batches: 1
    num_sanity_val_steps: 0
    val_check_interval: 1
    log_every_n_steps: 1
    max_epochs: 100000
    enable_checkpointing: false
    callbacks:
      early_stopping: null
      model_checkpoint: null
  data_config:
    shuffle_train: false
    use_train_for_val: true
    deterministic_transforms: true
    dataloader:
      batch_size: 1
      num_workers: 0
