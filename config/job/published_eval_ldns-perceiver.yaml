# ldns-perceiver: scored at its training window; compression computed on 256 units.
defaults:
  - /job/published_eval@_here_
  - _self_

eval_window_seconds: native
compression_n_neurons: 256
# 10 ms bins: the 10 ms-bin Poisson reference (still 0.1 s windows, while the model is scored at 4 s)
poisson_reference: hf://the-enigma-project/ntt-tokenizers/poisson_references/recon_bin10ms_rate10ms_window0.1s.json@64d8bb47951d4d1b06765a74db0e7ae8aec36436
