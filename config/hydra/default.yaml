# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run
run:
  dir: ${paths.log_dir}/${hydra:runtime.choices.job}/${paths.run_name}
# sweep:
#   dir: ${paths.log_dir}/${task_name}/multiruns/${paths.run_name}
#   subdir: ${hydra.job.num}
job_logging:
  handlers:
    file:
      # Writes the log file next to the run outputs, named after the selected job.
      filename: ${hydra.runtime.output_dir}/${hydra:runtime.choices.job}.log
