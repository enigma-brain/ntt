name: build_env_run_tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

# A newer push to the same PR supersedes its running checks; pushes to main all run.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Lint, type checking and tests are separate jobs, so a lint or type error does not
    # stop the tests from running (and each failure shows up on its own).
    lint:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.13"]

        steps:
            - uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "latest"

            - name: Install dependencies
              run: |
                  uv sync --locked --extra dev

            - name: Run ruff (linting)
              run: |
                  uv run ruff check .

            - name: Run ruff (formatting)
              run: |
                  uv run ruff format --check .

    typecheck:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.13"]

        steps:
            - uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "latest"

            - name: Install dependencies
              run: |
                  uv sync --locked --extra dev

            - name: Run type checking
              run: |
                  uv run pyright

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                python-version: ["3.13"]

        steps:
            - uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v6
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "latest"

            - name: Install dependencies
              run: |
                  uv sync --locked --extra dev

            - name: Run tests
              run: |
                  uv run pytest --cov=src/ntt --cov-report=xml --cov-report=term-missing

            - name: Upload coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  file: ./coverage.xml
                  fail_ci_if_error: false

    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.13"
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  version: "latest"
            - name: Install dependencies
              run: uv sync --locked --extra dev
            - name: Run pre-commit
              run: uv run pre-commit run --all-files
