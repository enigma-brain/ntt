# Upstream-source registry for the NTT public dataset Croissant manifest.
#
# One entry per public brainset (10 total: 7 held-in + 3 xsource held-out).
# Consumed by scripts/generate_croissant.py to build the FileObject / FileSet
# entries that point at upstream public sources.
#
# Field semantics:
#   contentUrl(s) : canonical public URL(s) where the source bytes can be
#                   obtained. A single string -> one FileObject. A list ->
#                   multiple FileObjects under one FileSet for that brainset.
#   license       : SPDX identifier (preferred) or canonical license URL when
#                   no SPDX equivalent exists (Allen Terms of Use, CRCNS).
#   license_url   : Canonical URL where the license text lives.
#   citation      : BibTeX entry for the upstream paper / dataset.
#   description   : Short prose describing the upstream dataset.
#   retrieved     : ISO date the URL was last verified.
#   notes         : Human-readable caveats (NC restriction, redistributability).

